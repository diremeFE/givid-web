name: Monthly maintenance check

on:
  schedule:
    # 1st of each month at 04:00 UTC
    - cron: "0 4 1 * *"
  workflow_dispatch: {}

permissions:
  actions: read
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Run maintenance checks
        env:
          SITE_URL: https://gisvalida.com
          MAINTENANCE_CHECK_SECRET: ${{ secrets.MAINTENANCE_CHECK_SECRET }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts-ci/maintenance-check.mjs
