name: Weekly database backup

on:
  schedule:
    # Every Monday at 03:00 UTC
    - cron: "0 3 * * 1"
  workflow_dispatch: {}

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Dump database
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          mkdir -p backup
          pg_dump "$DATABASE_URL" --no-owner --no-privileges -F c -f backup/givid-db-$(date +%Y-%m-%d).dump

      - name: Upload backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: givid-db-backup-${{ github.run_id }}
          path: backup/*.dump
          retention-days: 35
